/* Layout: a festival price list. Sticky toolbar, category sections of product rows,
   a fixed bottom bar with each person's running total. Rows are a grid that
   becomes a two-tier card on phones. */
:root{
  --bg:#f3f2f7; --surface:#ffffff; --sunk:#e9e7f1; --line:#dcd9e6;
  --fg:#1c1830; --muted:#6a6582; --accent:#d9730d; --accent-ink:#ffffff;
  --m:#0f7c74; --n:#c26a00; --s:#b3245b; --yt:#cc1f1f; --ok:#1e7b46; --bad:#b3261e;
  --cat-bg:#2a1f4a; --cat-fg:#fff6e8;
  --display:"Yatra One","Georgia",serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121d; --surface:#1d1a29; --sunk:#262236; --line:#343048;
  --fg:#eeebf7; --muted:#a39dbb; --accent:#f39a3d; --accent-ink:#1a1206;
  --m:#3cc1b5; --n:#f0a443; --s:#ef6f9f; --yt:#ff5a5a; --ok:#5ccf8c; --bad:#ff7a70; --cat-bg:#3a2c66; --cat-fg:#fff6e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121d; --surface:#1d1a29; --sunk:#262236; --line:#343048;
  --fg:#eeebf7; --muted:#a39dbb; --accent:#f39a3d; --accent-ink:#1a1206;
  --m:#3cc1b5; --n:#f0a443; --s:#ef6f9f; --yt:#ff5a5a; --ok:#5ccf8c; --bad:#ff7a70; --cat-bg:#3a2c66; --cat-fg:#fff6e8; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 150px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h1 .spark{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.sub a{color:inherit}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status[data-s="saved"] i{background:var(--ok)}
.status[data-s="saving"] i{background:var(--accent);animation:pulse 1s infinite}
.status[data-s="error"] i,.status[data-s="readonly"] i,.status[data-s="local"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.status i{animation:none!important}}

.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.toolbar input{flex:1 1 220px}
.toolbar select{flex:0 1 auto}
.notice{background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:14px;margin:10px 0;color:var(--fg)}

section.cat{margin-top:28px}
.cat h2{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 10px;padding:12px 16px;border-radius:var(--radius);
  background:var(--cat-bg);color:var(--cat-fg);font-family:var(--display);font-weight:400;font-size:clamp(20px,3.6vw,26px);line-height:1.15;letter-spacing:.01em}
.cat h2 .tag{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.cat h2 .count{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}

.head,.row{display:grid;grid-template-columns:96px minmax(0,1fr) 92px 96px repeat(3,92px) 100px;align-items:center;gap:12px}
.row .qty{padding-top:18px}
.head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 12px 6px}
.head .r,.row .r{text-align:right}
.head .pm{color:var(--m)} .head .pn{color:var(--n)} .head .ps{color:var(--s)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.picked{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.thumb{width:96px;height:96px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--accent);font-size:12px;font-weight:700;border:1px solid var(--line);overflow:hidden;position:relative}
.thumb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.thumb:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--sunk))}
.name{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.yt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--yt);text-decoration:none;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--yt) 35%,transparent);white-space:nowrap;justify-self:start}
.yt:hover{background:color-mix(in srgb,var(--yt) 10%,transparent)}
.yt svg{width:14px;height:14px;fill:currentColor}
.price{text-align:right;font-variant-numeric:tabular-nums}
.price b{display:block;font-size:16px}
.price s{font-size:12px;color:var(--muted)}
.qty{display:flex;flex-direction:column;gap:2px}
.qty label{display:none;font-size:12px;font-weight:700}
.qty select{width:100%;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums;font-weight:600;text-align:center}
.qty select.on{border-color:currentColor;background:var(--surface)}
.qty .pamt{min-height:18px;font-size:13px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.q-m{color:var(--m)} .q-n{color:var(--n)} .q-s{color:var(--s)}
.qty select{color:var(--fg)} .qty select.on{color:inherit}
.total{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.total.zero{color:var(--muted);font-weight:400}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:820px){
  .head{display:none}
  .row{grid-template-columns:96px minmax(0,1fr) auto;grid-template-areas:"img name price" "img yt price" "qty qty qty";row-gap:6px;column-gap:12px}
  .thumb{grid-area:img;align-self:start}
  .row .nm{grid-area:name}
  .row .yt{grid-area:yt}
  .price{grid-area:price;align-self:start}
  .qtys{grid-area:qty;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
  .qty label{display:block}
  .row .qty{padding-top:0}
  .total{align-self:start;padding-top:24px;min-width:64px}
}
@media (min-width:821px){ .qtys{display:contents} }

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.2fr) auto;gap:8px}
.pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--fg);background:var(--surface);color:var(--fg);font-weight:700;font-size:13px;cursor:pointer}
.pdf svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pdf:hover{background:var(--sunk)} .pdf[disabled]{opacity:.6;cursor:progress}
.bar-msg{max-width:1180px;margin:6px auto 0;font-size:13px;color:var(--fg)}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;text-align:left;cursor:pointer;min-width:0}
.tile[aria-pressed="true"]{border-color:currentColor;background:var(--surface)}
.tile .who{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tile .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.all{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.all .amt,.tile.all .cnt{color:var(--accent-ink)}
.tile.all[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px}
@media (max-width:560px){
  .bar-in{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile.all{grid-column:1 / span 2} .pdf{flex-direction:row;gap:6px}
  .tile{padding:5px 8px} .tile .amt{font-size:15px}
  .wrap{padding-block:20px 200px}
}

<script>

  const inr = new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2,minimumFractionDigits:0});
  const fmt = n => inr.format(Math.round(n*100)/100);

  // Flatten catalog
  const products = [];
  const byCode = {};

    const [code,name,content,mrp,price,img] = r;
    const src = img.startsWith("p:") ? IMG+".com/upload/product_image_"+img.slice(2)+".webp" : IMG+"djcrackers.com/upload/"+img.slice(2)+".webp";
    const key=(code+"_"+name).replace(/[^A-Za-z0-9]+/g,"_");
    const p = {code,name,content,mrp,price,src,ci,key,imgId:img};
    products.push(p); if(!(code in byCode)) byCode[code]=p;
  }));

  // State: confirmed (from server) + local overrides waiting to save
  const remote = {Mansoor:{},Nagendra:{},Santosh:{}};
  const pending = {Mansoor:{},Nagendra:{},Santosh:{}};
  const inflight = {Mansoor:{},Nagendra:{},Santosh:{}};
  const exists = {Mansoor:false,Nagendra:false,Santosh:false};
  const qty = (person,code) => {
    if (code in pending[person]) return pending[person][code];
    if (code in inflight[person]) return inflight[person][code];
    const r=remote[person];
    if (code in r) return Number(r[code]||0);
    // picks saved by the first version were keyed by product code alone
    const p=byKey[code];
    if (p && byCode[p.code]===p && (p.code in r)) return Number(r[p.code]||0);
    return 0;
  };
  const byKey={}; products.forEach(p=>byKey[p.key]=p);

  // ---- Build DOM once
  const $cat = document.getElementById("cat");
  CATALOG.forEach((c,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=c.cat;$cat.appendChild(o);});
  const main = document.getElementById("catalog");
  const rowEls = {};
  const ytIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.5-4.8.5-4.8s0-3.2-.5-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>';
  const sections = [];
  CATALOG.forEach((c,ci)=>{
    const sec = document.createElement("section"); sec.className="cat";
    const h = document.createElement("h2");
    h.innerHTML = '<span></span><span class="tag"></span><span class="count"></span>';

    sections.push({sec,list,countEl:h.children[2],ci});
  });
  products.forEach(p=>{
    const row = document.createElement("div"); row.className="row";
    // Photos are stored with the page (photos/<id>.webp); tapping one opens the shop's
    // full-size picture in a new tab. A missing photo leaves the "Photo" button showing.
    const img = document.createElement("a"); img.className="thumb"; img.href=p.src; img.target="_blank"; img.rel="noopener";

    const pic=document.createElement("img"); pic.alt=""; pic.loading="lazy"; pic.src="photos/"+p.imgId.replace(":","_")+".webp";
    pic.onerror=()=>pic.remove(); img.appendChild(pic);
    const nm = document.createElement("div"); nm.className="nm";
    nm.innerHTML='<div class="name"></div><div class="meta"></div>';
    nm.children[0].textContent=p.name;
    nm.children[1].textContent="Code "+p.code+" · "+p.content;
    const yt = document.createElement("a"); yt.className="yt"; yt.target="_blank"; yt.rel="noopener";

    if (p.mrp!==p.price) pr.children[1].textContent=fmt(p.mrp);
    const qtys = document.createElement("div"); qtys.className="qtys";
    const sels = {}, pamts = {};
    PEOPLE.forEach(person=>{
      const w=document.createElement("div"); w.className="qty "+PCLASS[person];

      s.addEventListener("change",()=>setQty(person,p.key,Number(s.value)));

    const cur=Number(sel.value);
    const vals=[...new Set([...QTY_OPTS,cur])].sort((x,y)=>x-y);
    sel.textContent="";
    vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o);});
    sel.value=String(cur);
  }
  function ensureOption(sel,v){
    if (![...sel.options].some(o=>Number(o.value)===v)){const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o);}
  }
  function paint(){
    const sum={Mansoor:0,Nagendra:0,Santosh:0}, cnt={Mansoor:0,Nagendra:0,Santosh:0};
    products.forEach(p=>{
      const r=rowEls[p.key]; let rowQty=0;
      PEOPLE.forEach(person=>{
        const v=qty(person,p.key); const s=r.sels[person];
        ensureOption(s,v);
        if (Number(s.value)!==v && document.activeElement!==s) s.value=String(v);
        s.classList.toggle("on",v>0);
        const amt = v>0 ? fmt(v*p.price) : "";
        if (r.pamts[person].textContent!==amt) r.pamts[person].textContent=amt;
        rowQty+=v; sum[person]+=v*p.price; cnt[person]+=v;
      });
      r.row.classList.toggle("picked",rowQty>0);
      r.tot.textContent = rowQty>0 ? fmt(rowQty*p.price) : "–";
      r.tot.classList.toggle("zero",rowQty===0);
      r.rowQty=rowQty;
    });
    let all=0,allc=0;
    PEOPLE.forEach(person=>{
      document.getElementById("t-"+person).textContent=fmt(sum[person]);
      document.getElementById("c-"+person).textContent=cnt[person]+(cnt[person]===1?" item":" items");
      all+=sum[person]; allc+=cnt[person];
    });
    document.getElementById("t-all").textContent=fmt(all);
    document.getElementById("c-all").textContent=allc+(allc===1?" item":" items");
    filter();
  }

  // ---- Filtering
  const $q=document.getElementById("q"), $show=document.getElementById("show");
  function filter(){
    const q=$q.value.trim().toLowerCase(), cat=$cat.value, show=$show.value;
    let shownTotal=0;
    const perSec=sections.map(()=>0);
    products.forEach(p=>{
      const r=rowEls[p.key];
      let ok = (!q || p.name.toLowerCase().includes(q) || p.code.toLowerCase()===q) && (cat==="" || String(p.ci)===cat);
      if (ok && show==="any") ok = r.rowQty>0;
      else if (ok && show!=="all") ok = qty(show,p.key)>0;
      r.row.hidden=!ok; if(ok){perSec[p.ci]++;shownTotal++;}
    });
    sections.forEach((s,i)=>{s.sec.hidden=perSec[i]===0; s.countEl.textContent=perSec[i]+(perSec[i]===1?" item":" items");});
    emptyMsg.hidden=shownTotal>0;
    document.querySelectorAll(".tile").forEach(t=>t.setAttribute("aria-pressed",String(t.dataset.p===show)));
  }
  $q.addEventListener("input",filter); $cat.addEventListener("change",filter); $show.addEventListener("change",filter);
  document.querySelectorAll(".tile").forEach(t=>t.addEventListener("click",()=>{
    $show.value = $show.value===t.dataset.p ? "all" : t.dataset.p; filter();
    window.scrollTo({top:0,behavior:"smooth"});
  }));

  // ---- Status
  const $st=document.getElementById("status"), $stt=document.getElementById("statusText"), $notice=document.getElementById("notice");
  function status(s,t){$st.dataset.s=s;$stt.textContent=t;}
  function notice(t){$notice.textContent=t;$notice.hidden=!t;}

  // ---- Saving (Firebase Realtime Database, REST API; address set in config.js)
  const FB=(window.FIREBASE_URL||"").trim().replace(/\/+$/,"");
  const timers={}, busy={};
  const idle=()=>!PEOPLE.some(x=>busy[x]||Object.keys(pending[x]).length);
  function setQty(person,key,v){
    pending[person][key]=v;
    paint();
    if (!FB){ status("local","Not saved: storage isn't set up yet"); return; }
    status("saving","Saving…");
    clearTimeout(timers[person]);
    timers[person]=setTimeout(()=>flush(person),400);
  }
  async function flush(person){
    if (busy[person]) return;
    const batch=pending[person]; if (!Object.keys(batch).length) return;
    pending[person]={}; inflight[person]=Object.assign({},batch);
    busy[person]=true;
    try{
      // PATCH only touches the items being changed, so people editing at the same time don't overwrite each other
      const r=await fetch(FB+"/orders/"+person+".json",{method:"PATCH",body:JSON.stringify(batch)});
      if(!r.ok){ const e=new Error("http"); e.status=r.status; throw e; }
      Object.assign(remote[person],batch);
      inflight[person]={}; busy[person]=false;
      if (Object.keys(pending[person]).length) flush(person);
      else if (idle()) status("saved","All changes saved");
    }catch(e){
      busy[person]=false;
      pending[person]=Object.assign({},inflight[person],pending[person]); inflight[person]={};
      if (e.status===401||e.status===403){
        status("error","Not saved");
        notice("The database refused the change. In Firebase, open Realtime Database → Rules and allow read and write.");
      } else {
        status("error","Not saved, retrying…");
        setTimeout(()=>flush(person),3000);
      }
      paint();
    }
  }

  // ---- PDF of the order
  const PDF_LIBS=[
    ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"],
    ["https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js","https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"]
  ];
  function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s);});}
  async function loadPdfLibs(){
    for (const alts of PDF_LIBS){
      if (alts[0].includes("autotable") && window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) continue;
      if (!alts[0].includes("autotable") && window.jspdf) continue;
      let loaded=false;
      for (const u of alts){ try{ await loadScript(u); loaded=true; break; }catch(e){} }
      if(!loaded) throw new Error("lib");
    }
  }
  const $barMsg=document.getElementById("barMsg");
  let msgTimer;
  function barMsg(t){ $barMsg.textContent=t; $barMsg.hidden=!t; clearTimeout(msgTimer); if(t) msgTimer=setTimeout(()=>{$barMsg.hidden=true;},6000); }
  function orderData(){
    const groups=[];
    CATALOG.forEach((c,ci)=>{
      const rows=products.filter(p=>p.ci===ci).map(p=>{
        const q={}; PEOPLE.forEach(x=>q[x]=qty(x,p.key));
        const t=PEOPLE.reduce((a,x)=>a+q[x],0);
        return t>0?{code:p.code,name:p.name,price:p.price,q,t}:null;
      }).filter(Boolean);
      if(rows.length) groups.push({cat:c.cat,rows});
    });
    return groups;
  }
  window.__buildOrderPdf = buildOrderPdf; // exposed for testing
  function buildOrderPdf(jsPDF, groups, when){
    const rs = n => "Rs. "+(Math.round(n*100)/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
    const doc=new jsPDF({unit:"pt",format:"a4"});
    const W=doc.internal.pageSize.getWidth();
    doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("Diwali Cracker Order",40,48);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90);
    doc.text("Goat Crackers (djcrackers.com) price list  |  Generated "+when,40,64);
    doc.setTextColor(0);
    const body=[]; const per={}; PEOPLE.forEach(x=>per[x]={q:0,amt:0}); let grand=0;
    groups.forEach(g=>{
      body.push([{content:g.cat,colSpan:8,styles:{fillColor:[42,31,74],textColor:[255,246,232],fontStyle:"bold",fontSize:10}}]);
      g.rows.forEach(r=>{
        PEOPLE.forEach(x=>{per[x].q+=r.q[x]; per[x].amt+=r.q[x]*r.price;});
        grand+=r.t*r.price;
        body.push([r.code,r.name,rs(r.price),r.q.Mansoor||"",r.q.Nagendra||"",r.q.Santosh||"",r.t,rs(r.t*r.price)]);
      });
    });
    doc.autoTable({
      startY:80, head:[["Code","Item","Price","Mansoor","Nagendra","Santosh","Qty","Amount"]], body,
      foot:[["","Total","",per.Mansoor.q,per.Nagendra.q,per.Santosh.q,PEOPLE.reduce((a,x)=>a+per[x].q,0),rs(grand)]],
      theme:"grid", styles:{fontSize:9,cellPadding:4,valign:"middle"},
      headStyles:{fillColor:[217,115,13],textColor:255}, footStyles:{fillColor:[240,236,248],textColor:20,fontStyle:"bold"},
      columnStyles:{0:{cellWidth:44},2:{halign:"right",cellWidth:62},3:{halign:"center",cellWidth:50},4:{halign:"center",cellWidth:54},5:{halign:"center",cellWidth:50},6:{halign:"center",cellWidth:34},7:{halign:"right",cellWidth:72}},
      margin:{left:40,right:40}, showFoot:"lastPage",
      didParseCell:c=>{ const al={2:"right",3:"center",4:"center",5:"center",6:"center",7:"right"}[c.column.index]; if(al && c.section!=="body") c.cell.styles.halign=al; }
    });
    let y=doc.lastAutoTable.finalY+24;
    if (y>doc.internal.pageSize.getHeight()-150){ doc.addPage(); y=48; }
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("Totals by person",40,y);
    doc.autoTable({
      startY:y+8, head:[["Person","Items","Amount"]],
      body:PEOPLE.map(x=>[x,per[x].q,rs(per[x].amt)]),
      foot:[["Grand total",PEOPLE.reduce((a,x)=>a+per[x].q,0),rs(grand)]],
      theme:"grid", styles:{fontSize:11,cellPadding:6}, headStyles:{fillColor:[42,31,74],textColor:[255,246,232]},
      footStyles:{fillColor:[217,115,13],textColor:255,fontStyle:"bold"},
      columnStyles:{1:{halign:"center"},2:{halign:"right"}}, margin:{left:40,right:W-340},
      didParseCell:c=>{ const al={1:"center",2:"right"}[c.column.index]; if(al) c.cell.styles.halign=al; }
    });
    return doc;
  }
  const $pdf=document.getElementById("pdfBtn");
  $pdf.addEventListener("click", async ()=>{
    const groups=orderData();
    if(!groups.length){ barMsg("Pick at least one item first, then download the PDF."); return; }
    $pdf.disabled=true; barMsg("Preparing PDF…");
    try{
      await loadPdfLibs();
      const now=new Date();
      const when=now.toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
      const doc=buildOrderPdf(window.jspdf.jsPDF, groups, when);
      doc.save("cracker-order-"+now.toISOString().slice(0,10)+".pdf");
      barMsg("PDF downloaded.");
    }catch(e){
      const c=e&&e.code;
      if(c==="declined") barMsg("");
      else if(c==="rate_limited") barMsg("A download prompt is already open.");
      else if(e&&e.message==="lib") barMsg("Couldn't load the PDF maker. Check your connection and try again.");
      else barMsg("Couldn't create the PDF. Try again.");
    }finally{ $pdf.disabled=false; }
  });

  // ---- Connect: load picks and stream live changes from Firebase
  function applyEvent(ev,isPatch){
    let msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
    if(!msg) return;
    const parts=(msg.path||"/").split("/").filter(Boolean), data=msg.data;
    if (parts.length===0){
      if (!isPatch) PEOPLE.forEach(x=>remote[x]={});
      if (data) Object.keys(data).forEach(x=>{ if(PEOPLE.includes(x)) remote[x]=Object.assign({},data[x]||{}); });
    } else if (parts.length===1){
      const x=parts[0]; if(!PEOPLE.includes(x)) return;
      if (isPatch) Object.assign(remote[x],data||{}); else remote[x]=Object.assign({},data||{});
    } else {
      const x=parts[0], k=parts[1]; if(!PEOPLE.includes(x)) return;
      if (data===null) delete remote[x][k]; else remote[x][k]=data;
    }
    paint();
    if (idle()) status("saved","All changes saved");
  }
  paint();
  if (!FB){
    status("local","Storage not set up");
    notice("Picks can't be saved yet: this site still needs its database address.");
  } else {
    status("saving","Loading saved picks…");
    const es=new EventSource(FB+"/orders.json");
    es.addEventListener("put",e=>applyEvent(e,false));
    es.addEventListener("patch",e=>applyEvent(e,true));
    es.addEventListener("cancel",()=>{ status("error","No access"); notice("The database refused access. In Firebase, open Realtime Database → Rules and allow read and write."); });
    es.onopen=()=>{ notice(""); };
    es.onerror=()=>{ if(idle()) status("error","Reconnecting…"); };
  }
})();
</script>
